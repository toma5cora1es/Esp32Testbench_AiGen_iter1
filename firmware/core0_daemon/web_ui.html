<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UDE ESP32 Register Workbench</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--bd:#30363d;--fg:#e6edf3;--mut:#8b949e;--acc:#58a6ff;--ok:#3fb950;--warn:#f85149}
*{box-sizing:border-box;font-family:ui-monospace,Consolas,monospace}
body{margin:0;background:var(--bg);color:var(--fg);padding:14px}
.hdr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
h3{margin:0 0 10px 0;font-size:14px;color:var(--acc)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
input,select,button{background:#0d1117;color:var(--fg);border:1px solid var(--bd);border-radius:6px;padding:7px 10px;font-size:13px}
button{cursor:pointer;background:#1f6feb;border-color:#388bfd;font-weight:700}
button.sec{background:#21262d;border-color:var(--bd)}
button.ok{background:#238636;border-color:#2ea043}
button.warn{background:#da3633;border-color:#f85149}
.bits{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;margin-top:8px}
.bit{padding:6px 0;text-align:center;border:1px solid var(--bd);border-radius:4px;cursor:pointer;font-size:11px;user-select:none}
.bit.on{background:#238636;border-color:#3fb950;color:#fff;font-weight:700}
pre{background:#0d1117;border:1px solid var(--bd);border-radius:6px;padding:8px;max-height:200px;overflow:auto;font-size:12px;margin:0}
a{color:var(--acc);text-decoration:none}
</style>
</head>
<body>
<div class="hdr">
  <div><strong>UDE ESP32 WORKBENCH</strong> <span id="st" style="color:var(--ok)">Connecting...</span></div>
  <div class="row" style="margin:0">
    <a href="/agv">Open Mainboard Cockpit (/agv)</a>
    <button class="sec" onclick="cmd('POWER ECO')">80 MHz Eco</button>
    <button class="sec" onclick="cmd('POWER TURBO')">240 MHz Turbo</button>
    <button class="ok" onclick="cmd('INFO').then(log)">Info</button>
  </div>
</div>
<div class="grid">
  <div class="card">
    <h3>32-Bit Register & Bitfield Inspector</h3>
    <div class="row">
      <select id="preset" onchange="addr.value=this.value;readReg()">
        <option value="3FF44004">GPIO_OUT_REG (0x3FF44004)</option>
        <option value="3FF44020">GPIO_ENABLE_REG (0x3FF44020)</option>
        <option value="3FF4403C">GPIO_IN_REG (0x3FF4403C)</option>
        <option value="3FF4804C">RTC_CNTL_STORE0_REG (0x3FF4804C)</option>
        <option value="3FF48050">RTC_CNTL_STORE1_REG (0x3FF48050)</option>
      </select>
      <input id="addr" value="3FF44004" size="10">
      <button onclick="readReg()">Read</button>
    </div>
    <div class="row">
      <input id="val" value="00000000" size="10">
      <button class="ok" onclick="writeReg()">Write</button>
      <button class="sec" onclick="dumpReg()">Dump 8</button>
    </div>
    <div class="bits" id="bits"></div>
  </div>
  <div class="card">
    <h3>GPIO, ADC1 & Bus Quick Control</h3>
    <div class="row">
      GPIO <input id="pin" value="2" size="3">
      <button class="ok" onclick="cmd(`PIN ${pin.value} HIGH`).then(log)">HIGH</button>
      <button class="warn" onclick="cmd(`PIN ${pin.value} LOW`).then(log)">LOW</button>
      <button onclick="cmd(`PIN ${pin.value} TOGGLE`).then(log)">TOGGLE</button>
    </div>
    <div class="row">
      ADC1 Pin <select id="adcp"><option>36</option><option>39</option><option selected>34</option><option>35</option><option>32</option><option>33</option></select>
      <button onclick="readAdc()">Read ADC</button>
      <button class="sec" onclick="cmd('I2C SCAN').then(log)">I2C Scan</button>
      <button class="sec" onclick="cmd('ESPNOW PING').then(log)">ESP-NOW Ping</button>
    </div>
    <div class="row">
      CLI <input id="rawq" placeholder="PWM 4 1000 512" style="flex:1">
      <button onclick="cmd(rawq.value).then(log)">Send</button>
    </div>
    <pre id="out"></pre>
  </div>
</div>
<script>
let curVal=0;
const log=t=>{out.textContent=`> ${t}\n`+out.textContent.slice(0,2500);};
async function cmd(q){const r=await fetch('/cmd?q='+encodeURIComponent(q));return (await r.text()).trim();}
function renderBits(){
  const c=document.getElementById('bits'); c.innerHTML='';
  for(let b=31;b>=0;b--){
    const d=document.createElement('div');
    d.className='bit'+(((curVal>>>b)&1)?' on':'');
    d.textContent=b;
    d.onclick=()=>{curVal=(curVal^(1<<b))>>>0; val.value=curVal.toString(16).toUpperCase().padStart(8,'0'); writeReg();};
    c.appendChild(d);
  }
}
async function readReg(){const h=await cmd('R '+addr.value);curVal=parseInt(h,16)>>>0;val.value=h;renderBits();log('R '+addr.value+' = 0x'+h);}
async function writeReg(){const h=await cmd('W '+addr.value+' '+val.value);curVal=parseInt(h,16)>>>0;val.value=h;renderBits();log('W '+addr.value+' => 0x'+h);}
async function dumpReg(){log(await cmd('D '+addr.value+' 8'));}
async function readAdc(){const r=await cmd('ADC '+adcp.value);log(`ADC GPIO ${adcp.value} = ${r} (~${((+r/4095)*3.3).toFixed(3)} V)`);}
cmd('STATUS').then(s=>{st.textContent=s;readReg();});
</script>
</body>
</html>
